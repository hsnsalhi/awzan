<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>زليج الأوزان</title>
<meta name="description" content="أوزان الأفعال العربية ومشتقاتها في القرآن الكريم، مرسومة جدارًا من الزليج: كل جذر نجمة، وكل وزن بتلة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg id="wall" aria-label="جدار الأوزان"></svg>

<header class="hud top">
  <div class="brand">
    <h1>زليج الأوزان</h1>
    <p>كل جذر نجمة · كل وزن بتلة</p>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="ابحث عن جذر أو فعل أو اسم… مثل: غفر، استطعم، مسلم" autocomplete="off">
    <div id="results" class="results hidden"></div>
  </div>
  <div class="stats">
    <div><b id="sRoots">٠</b><span>جذرًا</span></div>
    <div><b id="sVerbs">٠</b><span>فعلًا</span></div>
    <div><b id="sNouns">٠</b><span>اسمًا</span></div>
    <button id="quizBtn" class="pill">✦ تحدٍّ</button>
  </div>
</header>

<div class="hud zoom">
  <button data-z="in" aria-label="تكبير">＋</button>
  <button data-z="out" aria-label="تصغير">－</button>
  <button data-z="fit" aria-label="ملء الشاشة">⤢</button>
</div>

<div class="hud hint" id="hint">اسحب للتحريك · العجلة للتكبير · انقر على نجمة لتفتحها · اختر وزنًا في الأسفل لترى انتشاره</div>

<nav class="hud filters" id="filters"></nav>

<aside id="side" class="side hidden"><button class="x" aria-label="إغلاق">✕</button><div id="sideBody"></div></aside>

<div id="rose" class="rose hidden">
  <button class="x back" aria-label="رجوع">→ الجدار</button>
  <div class="rose-stage"><svg id="roseSvg" viewBox="-320 -300 640 600"></svg></div>
  <div class="rose-panel" id="rosePanel"></div>
</div>

<div id="quiz" class="quiz hidden">
  <div class="quiz-box">
    <button class="x" aria-label="إغلاق">✕</button>
    <div class="quiz-head"><span>النقاط <b id="qScore">٠</b> / <b id="qTotal">٠</b></span><span>🔥 <b id="qStreak">٠</b></span></div>
    <div id="quizCard"></div>
  </div>
</div>

<div id="tip" class="tip hidden"></div>

<script src="js/data.js"></script>
<script src="js/morph.js"></script>
<script src="js/app.js"></script>
</body>
</html>
